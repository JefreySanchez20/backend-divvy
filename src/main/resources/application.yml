spring:
  application:
    name: backend-divvy

  autoconfigure:
    exclude: org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:divvy}?sslmode=${DB_SSLMODE:disable}
    username: ${DB_USER:divvy}
    password: ${DB_PASSWORD:divvy}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

server:
  port: ${PORT:${SERVER_PORT:8080}}

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never
  health:
    mail:
      enabled: false

springdoc:
  api-docs:
    enabled: ${SWAGGER_ENABLED:true}
  swagger-ui:
    enabled: ${SWAGGER_ENABLED:true}
    tags-sorter: alpha

divvy:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-this-is-a-dev-only-secret-key-32bytes+}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  password-reset:
    expiration-minutes: ${PASSWORD_RESET_EXPIRATION_MINUTES:30}
  rate-limit:
    window-minutes: ${RATE_LIMIT_WINDOW_MINUTES:15}
    login: ${RATE_LIMIT_LOGIN:5}
    register: ${RATE_LIMIT_REGISTER:5}
    forgot-password: ${RATE_LIMIT_FORGOT_PASSWORD:3}
    reset-password: ${RATE_LIMIT_RESET_PASSWORD:5}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:3000}

logging:
  level:
    com.divvy: ${LOG_LEVEL:DEBUG}
